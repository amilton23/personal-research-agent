[project]
name = "personal-research-agent"
version = "0.1.0"
description = "Personal Research Agent with LangGraph"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "python-dotenv",
    "requests",
    "langgraph-cli>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
