[project]
name = "personal-research-agent"
version = "0.1.0"
description = "Personal Research Agent with LangGraph"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "requests",
    "networkx",
    "langchain",
    "langchain-openai",
    "langchain-google-genai",
    "langgraph-cli>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]",
]
